{{ define "page" }}
<article class="container">
  {{/* <h1>{{ .Title }}</h1> */}}
  {{ range .Sections }}
  <h2>{{ .Title }}</h2>
  <ul>
    {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
  {{ end }}
</article>
{{ end }}

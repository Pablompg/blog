{{ define "page" }}

<div class="about" style="padding: 2rem 1.5rem;">
  <img src="/images/icono-blog.png" alt="Italian Trulli">

  <div class="about__description">
    Desde Segovia. Apasionado de la serpiente azul y amarilla.
    Aquí encontrarás un poco de todo: reflexiones, programación, economía, matemáticas ... 
  </div>
</div>

<article class="container">
  {{ range .Sections }}
  <h2 class="section__title">{{ .Title }}</h2>
  <ul>
    {{ range .Pages }}
      <li class="section__elements">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
  {{ end }}
</article>
{{ end }}

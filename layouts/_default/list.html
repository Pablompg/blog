{{ define "page" }}

<div class="about" style="padding: 2rem 1.5rem;">
  <img src="/images/aqueduct-python.png" alt="Italian Trulli">

  <div class="about__description">
    Desde Segovia. Con mucho amor por las serpientes amarillas y azules ;)
  </div>
</div>

<article class="container">
  {{/* <h1>{{ .Title }}</h1> */}}
  {{ range .Sections }}
  <h2>{{ .Title }}</h2>
  <ul>
    {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
  {{ end }}
</article>
{{ end }}
